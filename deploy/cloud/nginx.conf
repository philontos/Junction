user nginx;
worker_processes auto;
pid /run/switchyard-nginx.pid;
error_log /var/log/nginx/switchyard-error.log warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format scoped '$remote_addr [$time_local] $request_method $uri $status $body_bytes_sent';
  access_log /var/log/nginx/switchyard-access.log scoped;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    server_name __PUBLIC_HOST__;
    location /.well-known/acme-challenge/ { root /srv/switchyard-cloud/acme; }
    location / { return 301 https://__PUBLIC_HOST__$request_uri; }
  }
  server {
    listen 443 ssl;
    server_name __PUBLIC_HOST__;
    ssl_certificate /etc/switchyard-cloud/letsencrypt/live/switchyard/fullchain.pem;
    ssl_certificate_key /etc/switchyard-cloud/letsencrypt/live/switchyard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SwitchyardTLS:10m;
    add_header Strict-Transport-Security 'max-age=86400' always;
    client_max_body_size 128m;
    location / {
      proxy_pass http://127.0.0.1:8780;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 190s;
      proxy_send_timeout 190s;
    }
  }
}
