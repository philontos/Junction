<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1a1613">
  <title>Context · Junction</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/navigation.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/cloud/style.css">
  <link rel="stylesheet" href="/cloud/workspace.css">
  <link rel="stylesheet" href="/cloud/device-manager.css">
  <script defer src="/page-load.js"></script>
  <link rel="stylesheet" href="/css/junction.css">
  <script src="/i18n.js"></script>
  <script type="module" src="/cloud/app.js"></script>
</head>
<body class="cloud-portal" data-page-loading>
  <div id="boot" role="status" aria-label="加载中"><div class="spinner"></div></div>
  <header>
    <a class="brand" href="/" aria-label="Junction"><img class="brand-logo brand-logo-dark" src="/assets/junction-wordmark.svg" alt="" aria-hidden="true"><img class="brand-logo brand-logo-light" src="/assets/junction-wordmark-light.svg" alt="" aria-hidden="true"></a>

    <div class="header-actions"><details id="portal-device-switcher" class="cloud-switcher" hidden><summary class="cloud-current" aria-label="切换设备"><span class="cloud-dot" id="portal-device-dot"></span><span class="cloud-current-name" id="portal-device-name">选择设备</span><span class="cloud-caret" aria-hidden="true"></span></summary><div class="cloud-device-panel"><div class="cloud-device-heading">切换设备</div><div id="portal-device-list"></div><button id="manage-devices" class="cloud-menu-action">设备接入与配置</button></div></details><div id="account" hidden><span id="username"></span><button id="logout" class="sec">退出</button></div><button id="theme-toggle" class="sec" type="button" aria-label="切换主题"></button></div>
  </header>
  <div class="product-layout">
    <nav class="primary-nav" aria-label="主导航" id="primary-nav" hidden><a id="workbench-nav" href="/workbench" data-theme-link><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M3 9h18M9 9v11"/></svg><span class="primary-nav-label">工作台</span></a><a id="context-nav" href="/contexts" data-theme-link><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span class="primary-nav-label">Context</span></a></nav>
  <main class="portal-main" id="portal-main">
    <section id="context-space" hidden aria-label="Context 共享空间"><div class="heading context-intro"><div><h1>Context</h1><p>汇聚工作上下文，让任务从这里继续。</p></div></div><div class="portal-section-loading" role="status"><span class="spinner" aria-hidden="true"></span><span>加载中…</span></div></section>
    <section id="auth" class="auth" hidden>
      <h1 id="auth-title">登录 Junction</h1>
      <p id="auth-description">连接你的设备，继续工作。</p>
      <form id="auth-form">
        <label id="user-label">账号<input id="user" name="username" autocomplete="username" required maxlength="64" placeholder="你的账号"></label>
        <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="输入密码"></label>
        <button id="submit" class="primary" type="submit">登录</button>
      </form>
      <p id="auth-switch" class="auth-switch" hidden><span id="auth-switch-label">还没有账号？</span><button id="auth-toggle" class="text" type="button">注册账号</button></p>
    </section>
    <section id="workspace-entry" class="workspace-entry" hidden aria-label="工作台">
      <div class="workspace-entry-content"><h1>工作台</h1><p id="workspace-entry-status" role="status">正在打开工作设备…</p><button id="workspace-entry-action" class="primary" hidden>连接设备</button></div>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  </div>
</body>
</html>
