<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="local-entry-mode" content="__ENTRY_MODE__">
  <meta name="switchyard-cloud-origin" content="__CLOUD_ORIGIN__">
  <meta name="switchyard-device-id" content="__DEVICE_ID__">
  <title>Switchyard · 本机工作台</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')==='light'?'light':'dark';}catch{document.documentElement.dataset.theme='dark';}</script>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/cloud/style.css">
  <script type="module" src="/cloud/local-entry.js"></script>
</head>
<body class="cloud-portal">
  <header><a class="brand" href="__CLOUD_ORIGIN__/"><img class="brand-logo brand-logo-dark" src="/assets/switchyard-wordmark.png" alt="Switchyard"><img class="brand-logo brand-logo-light" src="/assets/switchyard-wordmark-light.png" alt="Switchyard"></a></header>
  <main><section class="auth local-entry">
    <h1 id="entry-title">打开本机工作台</h1>
    <p id="entry-status" role="status"><span class="spinner"></span> 正在连接…</p>
    <p id="entry-error" class="error" role="alert" hidden></p>
    <div class="setup-actions"><a id="entry-retry" class="enter" href="__CLOUD_ORIGIN__/local/open/__DEVICE_ID__" hidden>重新打开</a><a class="text" href="__CLOUD_ORIGIN__/workspace/__DEVICE_ID__/">返回云端工作台</a></div>
  </section></main>
</body>
</html>
